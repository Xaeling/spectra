[package]
name = "stataura"
version = "0.19.2"
edition = "2021"
rust-version = "1.92"
description = "StatAura — 科研数据统计与出版级绘图（Rust 原生）"
license = "MIT OR Apache-2.0"

[[bin]]
name = "stataura"
path = "src/main.rs"

[lib]
name = "stataura"
path = "src/lib.rs"

[[example]]
name = "gallery"
path = "examples/gallery.rs"

[[example]]
name = "curve_demo"
path = "examples/curve_demo.rs"

[[example]]
name = "layout_demo"
path = "examples/layout_demo.rs"

[build-dependencies]
winresource = "0.1.34"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "default_fonts",
    # 关键：没有它 egui-winit 的剪贴板是空实现 → Event::Paste 永不触发 → Ctrl+V 死。
    "clipboard",
] }
egui = "0.37"

# 出版级 2D 矢量引擎：tiny-skia 提供抗锯齿光栅化，ab_glyph 提供字形轮廓。
# 二者都是 resvg / usvg 生态里的 Rust 库；不依赖系统图形库，跨平台一致。
tiny-skia = "0.11.4"
ab_glyph = "0.2.32"

image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "tiff",
    "bmp",
    "webp",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"

rfd = "0.15"
arboard = "3"

crossbeam-channel = "0.5"
anyhow = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[[example]]
name = "imgtool"
path = "examples/imgtool.rs"

[[bench]]
name = "perf"
harness = false
